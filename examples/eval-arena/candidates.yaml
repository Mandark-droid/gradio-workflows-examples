# Swapping a candidate is a one-line edit here. Nothing downstream changes:
# the scorer, judge and aggregate nodes never name a model.
#
# All four ids confirmed served by Inference Providers on 2026-09-23.

dataset:
  dataset_id: "kshitijthakkar/gradio-workflow-eval-arena"
  dataset_config: default
  dataset_split: train

judge:
  model_id: openai/gpt-oss-20b
  max_rationale_words: 60
  max_new_tokens: 512

# There is deliberately no `revision` field. Inference Providers expose no way
# to request a specific model revision, so a revision here would imply a weight
# pin that cannot exist. `scripts/pin_revisions.py` records the current shas to
# model_provenance.json as after-the-fact provenance instead.
#
# Three of these four are reasoning models: they emit chain-of-thought into
# reasoning_content and put only the final answer in content. Qwen3 spent 345
# tokens reasoning about "7 x 23". A 512-token budget would cut a hard row off
# mid-thought, return empty content, and score it "unparseable" — penalising a
# model for thinking rather than for being wrong. Hence 1024.
candidates:
  - slot: a
    model_id: Qwen/Qwen3-8B
    max_new_tokens: 1024
    greedy: true
  - slot: b
    model_id: meta-llama/Llama-3.1-8B-Instruct
    max_new_tokens: 1024
    greedy: true
  - slot: c
    model_id: ibm-granite/granite-4.2-8b
    max_new_tokens: 1024
    greedy: true
